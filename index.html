<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기문명리</title>
    <meta name="theme-color" content="#7a3b2e" />
    <meta name="description" content="기문둔갑 사주 프로그램" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <main id="app">
      <header class="top">
        <h1>기문명리</h1>
        <span class="spacer"></span>
        <div id="headActions" class="head-actions" hidden>
          <button type="button" id="print" class="ghost">인쇄</button>
          <button type="button" id="savePng" class="ghost" title="이미지(PNG)로 저장" aria-label="이미지로 저장">이미지</button>
        </div>
      </header>

      <!-- 아래 입력 칸들은 main.ts 가 결과 화면의 왼쪽 위로 옮겨 놓는다 -->
      <div id="stash" hidden>
      <form id="form" class="panel no-export" autocomplete="off">
        <div class="row name-row">
          <label class="name-field"><input id="name" type="text" value="아무개" placeholder="이름" aria-label="이름" /></label>
          <fieldset class="seg">
            <legend class="sr-only">성별</legend>
            <label><input type="radio" name="gender" value="1" checked /> 남</label>
            <label><input type="radio" name="gender" value="0" /> 여</label>
          </fieldset>
          <div class="name-actions">
            <button type="submit" id="go">조회</button>
            <button type="button" id="save" class="ghost">저장</button>
            <button type="button" id="peopleBtn" class="ghost" aria-controls="peoplePanel" aria-expanded="false">목록</button>
          </div>
        </div>
        <div class="row">
          <fieldset class="seg">
            <legend class="sr-only">달력</legend>
            <label><input type="radio" name="cal" value="solar" checked /> 양력</label>
            <label><input type="radio" name="cal" value="lunar" /> 음력</label>
            <label><input type="radio" name="cal" value="leap" /> 윤달</label>
            <label><input type="radio" name="cal" value="pillars" /> 사주</label>
          </fieldset>
        </div>
        <div class="row dt" id="dtRow">
          <label><input id="y" type="number" min="1850" max="2050" /> 년</label>
          <label><input id="m" type="number" min="1" max="12" /> 월</label>
          <label><input id="d" type="number" min="1" max="31" /> 일</label>
          <label><input id="h" type="number" min="0" max="23" /> 시</label>
          <label><input id="mi" type="number" min="0" max="59" /> 분</label>
        </div>

        <div id="pillarsInput" hidden>
          <div class="pgrid" id="pgrid"></div>
          <p class="muted">사주(년월일시 간지)를 고르면 1924~2044년 사이에서 해당하는 생일시를 찾아줍니다.</p>
          <div id="candidates" class="cands"></div>
        </div>

        <p id="error" class="error" role="alert" hidden></p>
        <p id="msg" class="ok" role="status" hidden></p>
      </form>

      <section class="panel people no-export" id="peoplePanel" hidden>
        <div class="row between people-head">
          <h2>저장된 사람</h2>
          <button type="button" id="peopleClose" class="ghost sm">닫기</button>
        </div>
        <div class="people-tools">
          <input id="filter" type="search" placeholder="검색" aria-label="이름이나 비고로 검색" />
          <fieldset class="seg sortseg">
            <legend class="sr-only">정렬</legend>
            <label><input type="radio" name="psort" value="name" checked /> 이름</label>
            <label><input type="radio" name="psort" value="date" /> 생일</label>
            <label><input type="radio" name="psort" value="recent" /> 최근</label>
          </fieldset>
          <div class="people-io">
            <button type="button" id="export" class="ghost sm">내보내기</button>
            <label class="filebtn ghost sm">가져오기<input id="import" type="file" accept=".csv,.txt" hidden /></label>
          </div>
        </div>
        <ul id="peopleList" class="people-list"></ul>
        <p id="peopleEmpty" class="muted people-empty" hidden>저장된 사람이 없습니다.</p>
        <p class="muted small">이 기기의 브라우저에만 저장됩니다. 다른 기기로 옮기거나 백업하려면 내보내기를 쓰세요. 기존 프로그램의 data.csv 도 가져올 수 있습니다.</p>
      </section>

          <form id="sinsooForm" class="panel no-export" autocomplete="off">
            <div class="row">
              <fieldset class="seg">
                <legend class="sr-only">국</legend>
                <label><input type="radio" name="sinMode" value="year" checked /> 年局</label>
                <label><input type="radio" name="sinMode" value="month" /> 月局</label>
                <label><input type="radio" name="sinMode" value="day" /> 日局</label>
                <label><input type="radio" name="sinMode" value="time" /> 時局</label>
              </fieldset>
              <fieldset class="seg">
                <legend class="sr-only">달력</legend>
                <label><input type="radio" name="sinCal" value="lunar" checked /> 음력</label>
                <label><input type="radio" name="sinCal" value="solar" /> 양력</label>
              </fieldset>
            </div>
            <div class="row dt">
              <label><input id="sy" type="number" /> 년</label>
              <label><input id="sm" type="number" min="1" max="12" /> 월</label>
              <label><input id="sd" type="number" min="1" max="31" /> 일</label>
              <label><input id="sh" type="number" min="0" max="23" /> 시</label>
              <label><input id="smi" type="number" min="0" max="59" /> 분</label>
            </div>
            <div class="row actions">
              <button type="submit" id="sgo">변국 보기</button>
            </div>
            <p id="sinError" class="error" role="alert" hidden></p>
          </form>

      </div>

      <div id="result" class="toolbar no-export" hidden>
        <div class="tabs" role="tablist" aria-label="보기">
          <button type="button" id="tabQimen" class="tab on" role="tab" aria-selected="true">기문둔갑</button>
          <button type="button" id="tabYunyun" class="tab" role="tab" aria-selected="false">유년소운</button>
          <button type="button" id="tabHongguk" class="tab" role="tab" aria-selected="false">홍국기문</button>
          <button type="button" id="tabSinsoo" class="tab" role="tab" aria-selected="false">변국</button>
        </div>
      </div>

      <div id="basicHost"></div>
      <div id="sinsooHost" hidden></div>
      <footer class="foot">
        <button type="button" id="licenseBtn" class="linkbtn"><span id="licenseStatus">라이선스</span></button>
      </footer>
    </main>
    <div id="licenseModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="licTitle" hidden>
      <div class="modal-box">
        <h2 id="licTitle">라이선스</h2>
        <p id="licText" class="lic-text"></p>
        <label class="lic-label" for="licenseKey">정품키</label>
        <textarea id="licenseKey" rows="4" spellcheck="false" placeholder="GMR1-… 로 시작하는 정품키를 붙여넣으세요"></textarea>
        <p id="licError" class="error" role="alert" hidden></p>
        <div class="row lic-actions">
          <button type="button" id="licRegister">정품키 등록</button>
          <button type="button" id="licClose" class="ghost">닫기</button>
        </div>
        <p class="muted small">정품키는 발급받은 곳에 문의하세요. 체험 기간은 처음 사용한 날부터 5개월입니다.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
